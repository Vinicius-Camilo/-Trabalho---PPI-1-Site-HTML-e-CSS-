<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeste - Contato</title>
    <link rel="icon" type="image/ico" href="./Images/berry.ico">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 90%;
            line-height: 1.6;
            margin: auto;
            padding: 5%;
            background-color: #300523;
            background-image: url('./Images/background.jpg');
            background-size: cover;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background: linear-gradient(180deg, rgba(104, 198, 226, 0.15) 100%, rgba(104, 198, 226, 0.1) 50%);
            padding: 0.4em;
            border-radius: 0.75em;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.25em;
            z-index: 1;
            font-family: Roboto, Arial, monospace;
            font-size: 1.125em;
            width: 100%;
            max-width: 75em;
            margin-left: auto;
            margin-right: auto;
            text-shadow: none;
        }

        nav a {
            color: #ad292b;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            padding: 0.5em 0.75em;
            border-radius: 0.375em;
            display: inline-block;
            font-size: inherit;
        }

        nav a:hover {
            text-decoration: underline;
            color: #ed7549;
        }
        :root {
            --text-font: Roboto, Arial, monospace;
            --text-size: 1.2em;
            --text-color: #e0e0e0;
            --text-glow: 0 0 8px rgba(0, 123, 255, 0.85);
        }

        main, section, p, h1, h2, h3 {
            font-family: var(--text-font);
            font-size: var(--text-size);
            line-height: 1.5;
            color: var(--text-color);
            text-shadow: var(--text-glow);
            padding: 1%;
        }

        main, h1, h2, h3 {
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 30px;
        }

        a {
            color: #ad292b;
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 8%;
        }

        .madeline {
            position: absolute;
            z-index: 0;
            max-width: 50%;
            width: 50%;
            height: auto;
            right: -5%;
            top: 8%;
            pointer-events: none;
        }
        .strawberry {
            position: absolute;
            z-index: 2;
            max-width: 60%;
            width: 60%;
            height: auto;
            left: 51%;
            bottom: 10%;
            opacity: 0.75;
            pointer-events: none;
        }

        .logo {
            max-width: 75%;
            width: 60%;
            height: auto;
            display: block;
            position: relative;
            z-index: 1;
        }
        /* Formulário de contato */
        .contact-form {
            max-width: 48em;
            margin: 1.25em auto;
            padding: 1.25em;
            background: rgba(255,255,255,0.04);
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        label {
            font-weight: 600;
            font-size: 0.95em;
            color: var(--text-color);
        }

        input[type="text"], input[type="email"], textarea {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-color);
            padding: 0.6em 0.75em;
            border-radius: 0.5em;
            outline: none;
            font-family: var(--text-font);
            font-size: 1em;
        }
        input[type="text"], input[type="email"], select {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: black;
            padding: 0.6em 0.75em;
            border-radius: 0.5em;
            outline: none;
            font-family: var(--text-font);
            font-size: 1em;
        }

        input:focus, textarea:focus, select:focus {
            box-shadow: var(--text-glow);
            border-color: rgba(0,123,255,0.9);
        }

        textarea { resize: vertical; }

        .form-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .checkbox {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            color: var(--text-color);
            font-size: 0.9em;
        }

        .btn {
            background: linear-gradient(180deg,#ed7549,#ad292b);
            color: #fff;
            border: none;
            padding: 0.6em 1.1em;
            border-radius: 0.6em;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(173,41,43,0.18);
        }

        .btn:hover { transform: translateY(-2px); }

        .contact-info { margin-top: 1rem; color: var(--text-color); }

        @media (max-width: 680px) {
            .form-grid { grid-template-columns: 1fr; }
            .madeline { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="intro.html">Introdução</a>
        <a href="devs.html">Desenvolvedores</a>
        <a href="chars.html">Personagens</a>
        <a href="gameplay.html">Gameplay</a>
        <a href="niveis.html">Níveis</a>
        <a href="contato.html">Contato</a>
    </nav>

    <div class="logo-wrapper">
        <img src="./Images/madeline.png" alt="Madeline" class="madeline">
        <img src="./Images/strawberry.png" alt="Strawberry" class="strawberry">
        <img src="./Images/logo.png" alt="Celeste Logo" class="logo">
    </div>
    <main>
        <section>
            <h1>Fale Conosco</h1>

            <form class="contact-form" action="#" method="post" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="assunto">Assunto</label>
                        <input type="text" id="assunto" name="assunto" placeholder="Resumo da mensagem">
                    </div>

                    <div class="form-group">
                        <label for="motivo">Motivo</label>
                        <select id="motivo" name="motivo">
                            <option>Comentário</option>
                            <option>Dúvida</option>
                            <option>Sugestão</option>
                            <option>Reclamação</option>
                            <option>Bugs</option>
                            <option>Outro</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <div class="form-meta">
                    <label class="checkbox">
                        <input type="checkbox" name="consentimento" checked>
                        Aceito que este é um formulário ilustrativo e não enviará mensagens de verdade.
                    </label>

                    <button type="submit" class="btn">Enviar mensagem</button>
                </div>
            </form>

            <div class="contact-info">
                <p>Desenvolvedores de Celeste: contact@exok.com</p>
                <p>Desenvolvedor deste site: vinicius.camilo@estudante.iftm.edu.br</p>
            </div>
        </section>
    </main>

</body>
</html>
