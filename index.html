<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeste</title>
    <link rel="icon" type="image/ico" href="./Images/berry.ico">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 90%;
            line-height: 1.6;
            margin: auto;
            padding: 5%;
            background-color: #300523;
            background-image: url('./Images/background.jpg');
            background-size: cover;
            background-attachment: scroll;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background: linear-gradient(180deg, rgba(104, 198, 226, 0.15) 100%, rgba(104, 198, 226, 0.1) 50%);
            padding: 0.4em;
            border-radius: 0.75em;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.25em;
            z-index: 1;
            font-family: Roboto, Arial, monospace;
            font-size: 1.125em;
            width: 100%;
            max-width: 75em;
            margin-left: auto;
            margin-right: auto;
            text-shadow: none;
        }

        nav a {
            color: #ad292b;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            padding: 0.5em 0.75em;
            border-radius: 0.375em;
            display: inline-block;
            font-size: inherit;
        }

        nav a:hover {
            text-decoration: underline;
            color: #ed7549;
        }


        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .madeline {
            position: absolute;
            z-index: 0;
            max-width: 50%;
            width: 50%;
            height: auto;
            right: -5%;
            top: 8%;
            pointer-events: none;
        }
        .strawberry {
            position: absolute;
            z-index: 2;
            max-width: 60%;
            width: 60%;
            height: auto;
            left: 51%;
            bottom: 10%;
            opacity: 0.75;
            pointer-events: none;
        }

        .logo {
            max-width: 75%;
            width: 60%;
            height: auto;
            display: block;
            position: relative;
            z-index: 1;
        }

        .video-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10% 0 0;
        }

        .video-frame {
            width: 80%;
            max-width: 90%;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 1em;
            box-shadow: 0 0.75em 1.875em rgba(0, 0, 0, 0.35);
            margin-bottom: 10%;
        }


        .stores
        {
            width: 100%;
            box-sizing: border-box;
            float: left;
            margin-bottom: 2%;
            font: Arial, sans-serif;
            font-size: 1em;
        }
        .stores .store {
            width: 48%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
        }
        .store img {
            width: 100px;
        }

        .stores .consoles { 
            width: 100%;
            float: left;
            display: flex;
            align-content: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .stores .consoles a
        {
            width: 25%;
            padding: 1%;
            box-sizing: border-box;
            background: transparent;
            color: #fff;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            margin-right: 3%;
            transition: background 0.1s, border 0.2s;
            margin-bottom: 3%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.15rem;
            gap: 0.5em;
        }
        .stores .consoles a:nth-child(3n) { margin-right: 0; }
        .stores .consoles a img { width: 32px; flex: 0 0 auto; }
        .stores .consoles a span { margin: 0; display: block; }
        .stores .consoles a.store-switch { background: #e60012; }
        .stores .consoles a.store-ps4 { background: #0072ce; }
        .stores .consoles a.store-xb1 { background: #107c10; }
        .stores .consoles a.store-steam { background: #282e39; }
        .stores .consoles a.store-egs { background: #444; }
        .stores .consoles a.store-itch { background: #fa5c5c; }
        .stores .consoles a:hover {background: #222; border: 2px solid #fff; }

        @media (max-width: 48em) {
            .content .stores .consoles a { text-align: center; }
            .content .stores .consoles a img { width: 32px; float: none; }
            .content .stores .consoles a span { display: none; }
        }

        @media (min-width: 48.001em) {
            .stores .consoles a {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="intro.html">Introdução</a>
        <a href="devs.html">Desenvolvedores</a>
        <a href="chars.html">Personagens</a>
        <a href="gameplay.html">Gameplay</a>
        <a href="niveis.html">Níveis</a>
        <a href="contato.html">Contato</a>
    </nav>

    <div class="logo-wrapper">
        <img src="./Images/madeline.png" alt="Madeline" class="madeline">
        <img src="./Images/strawberry.png" alt="Strawberry" class="strawberry">
        <img src="./Images/logo.png" alt="Celeste Logo" class="logo">
    </div>

    <div class="video-wrapper">
        <iframe
            class="video-frame"
            src="https://www.youtube.com/embed/FqBj2IGg6Uw"
            title="Vídeo do YouTube"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <div class="stores">
        <div class="consoles">
            <a href="https://www.nintendo.com/games/detail/celeste-switch" class="store-switch" target="_blank" rel="noopener noreferrer"><img src="./Images/Stores/switch.png" alt="Nintendo Switch"><span><strong>Nintendo Switch</strong></span></a>
            <a href="https://www.playstation.com/en-ca/games/celeste-ps4/" class="store-ps4" target="_blank" rel="noopener noreferrer"><img src="./Images/Stores/ps4.png" alt="PlayStation 4"><span><strong>PlayStation 4</strong></span></a>
            <a href="https://www.microsoft.com/en-ca/store/p/celeste/bwmql2rpwbhb" class="store-xb1" target="_blank" rel="noopener noreferrer"><img src="./Images/Stores/xb1.png" alt="Xbox One"><span><strong>Xbox One</strong></span></a>
            <a href="https://mattmakesgames.itch.io/celeste" class="store-itch" target="_blank" rel="noopener noreferrer"><img src="./Images/Stores/itch.png" alt="itch.io"><span><strong>itch.io</strong></span></a>
            <a href="http://store.steampowered.com/app/504230/Celeste/" class="store-steam" target="_blank" rel="noopener noreferrer"><img src="./Images/Stores/steam.png" alt="Steam"><span><strong>Steam</strong></span></a>
            <a href="https://www.epicgames.com/store/en-US/product/celeste/home" class="store-egs" target="_blank" rel="noopener noreferrer"><img src="./Images/Stores/epic.png" alt="Epic Games Store"><span><strong>Epic Games Store</strong></span></a>
        </div>
     </div>

</body>
</html>
